<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Manuel Olivares | Música para Eventos Corporativos</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .lang-switch {
            position: absolute;
            top: -10px;
            right: 0;
            background: transparent;
            border: 1px solid #c5a059;
            color: #c5a059;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .lang-switch:hover {
            background-color: #c5a059;
            color: #0b0b0b;
        }
        h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-weight: 300;
            color: #b3b3b3;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            padding: 20px;
            background-color: #c5a059;
            color: #0b0b0b;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Botón para cambiar el idioma -->
        <button class="lang-switch" id="langBtn" onclick="toggleLanguage()">English</button>

        <h1 id="main-title">Manuel Olivares</h1>
        <p id="main-desc">Excelencia en música para eventos corporativos y ceremonias.</p>
        
        <a href="https://wa.me/56987767767?text=Hola%20Manuel,%20quiero%20cotizar%20música%20para%20un%20evento%20corporativo." class="btn" id="cta-link">COTIZAR EVENTO</a>
    </div>

    <script>
        let currentLang = 'es';

        function toggleLanguage() {
            const langBtn = document.getElementById('langBtn');
            const pageTitle = document.getElementById('page-title');
            const mainDesc = document.getElementById('main-desc');
            const ctaLink = document.getElementById('cta-link');

            if (currentLang === 'es') {
                currentLang = 'en';
                document.documentElement.lang = 'en';
                langBtn.textContent = 'Español';
                pageTitle.textContent = 'Manuel Olivares | Corporate Event Music';
                mainDesc.textContent = 'Excellence in music for corporate events and ceremonies.';
                ctaLink.textContent = 'GET A QUOTE';
                ctaLink.href = 'https://wa.me/56987767767?text=Hello%20Manuel,%20I%20would%20like%20to%20get%20a%20quote%20for%20corporate%20event%20music.';
            } else {
                currentLang = 'es';
                document.documentElement.lang = 'es';
                langBtn.textContent = 'English';
                pageTitle.textContent = 'Manuel Olivares | Música para Eventos Corporativos';
                mainDesc.textContent = 'Excelencia en música para eventos corporativos y ceremonias.';
                ctaLink.textContent = 'COTIZAR EVENTO';
                ctaLink.href = 'https://wa.me/56987767767?text=Hola%20Manuel,%20quiero%20cotizar%20música%20para%20un%20evento%20corporativo.';
            }
        }
    </script>
</body>
</html>
